name: Build_TVBox_Final

on:
  workflow_dispatch:

env:
  # 解决 image_6.png 中提到的 Node.js 24 兼容性问题
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 预处理环境
        run: |
          rm -f local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          # 强制注释掉可能导致报错的第 57 行及周边逻辑
          sed -i '55,65s/^/\/\//' app/build.gradle || true

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 执行编译
        # 加入 --no-daemon 确保干净的环境
        run: ./gradlew assembleDebug -x lint -x test --no-daemon

      - name: 自动寻找并上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Final_APK
          # 递归搜索所有目录下的 apk，确保万无一失
          path: "**/build/outputs/apk/**/*.apk"
