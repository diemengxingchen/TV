name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 环境预处理与代码手术
        run: |
          # 1. 安装 Python (Chaquopy 必需)
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          
          # 2. 暴力删除所有 signingConfigs 块
          # 使用 perl 直接删除从 signingConfigs 开始到其对应花括号结束的所有内容
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          
          # 3. 移除 build.gradle 中对 signingConfig 的引用行
          sed -i '/signingConfig/d' app/build.gradle
          
          # 4. 补齐 SDK 配置文件
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 强力构建
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Final_Fix
          path: app/build/outputs/apk/debug/*.apk
