name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 修复 Python 环境与签名
        run: |
          # 1. 安装 Python 环境（Chaquopy 插件构建时需要）
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          
          # 2. 强力修复 app/build.gradle
          # 使用通配符将所有 file(...) 引用 keystore 的行替换为 null，防止 NullPointerException
          sed -i 's/file(.*\.jks)/null/g' app/build.gradle
          sed -i 's/file(.*\.keystore)/null/g' app/build.gradle
          
          # 3. 移除强制签名校验逻辑
          # 这会将 signingConfig 这一行替换成注释，让 Gradle 使用默认 debug 签名
          sed -i 's/signingConfig signingConfigs.release/\/\/ signingConfig/g' app/build.gradle
          
          # 4. 初始化 SDK 路径
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 开始构建
        # 使用 --stacktrace 查看 Python 插件具体的安装错误（如果再次失败）
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Build
          path: |
            app/build/outputs/apk/debug/*.apk
