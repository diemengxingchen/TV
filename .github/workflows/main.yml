name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 极简重写 Build.gradle
        # 这一步会直接重写你的 app/build.gradle，彻底避开旧代码里的所有坑
        run: |
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.github.tvbox.osc'
              compileSdk 34
              
              defaultConfig {
                  applicationId "com.github.tvbox.osc"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }
              
              // 自动声明维度，防止之前的 "flavor dimension" 报错
              flavorDimensions "default"
          }

          dependencies {
              // 保持原有库的依赖
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF
          
          # 创建必要的 SDK 配置文件
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 强力构建 (debug 模式)
        # debug 构建会自动生成签名，无需任何证书文件
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Quick_Build
          path: app/build/outputs/apk/debug/*.apk
